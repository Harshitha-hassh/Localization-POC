worker_processes  1;

events {
    worker_connections  1024;
}

http {
    server {
        listen 80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html index.htm;
        include /etc/nginx/mime.types;

        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer;
        add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains';
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Permitted-Cross-Domain-Policies none always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()";
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: *.openweathermap.org *.rguest.com *.googleapis.com *.gstatic.com *.google.com *.qaigasp.com http://localhost:* http://*.local;";
        add_header Access-Control-Allow-Origin *;

        gzip on;
        gzip_min_length 1000;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

		proxy_pass_request_headers on;
	    proxy_read_timeout 600s;
		proxy_send_timeout 600s;
		
        location /commongateway/ {
			proxy_pass http://172.17.42.1/commongateway/;
		}		

        location /VisualOne/retailgateway/ {
			proxy_pass http://172.17.42.1/VisualOne/retailgateway/;
		}		
		
        location /VisualOne/ReportingService/ {
			proxy_pass http://172.17.42.1/VisualOne/ReportingService/;
		}

        location /Retail/ {
            		try_files $uri $uri/ /Retail/index.html;
        }
    }
}
