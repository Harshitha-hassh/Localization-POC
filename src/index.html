<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Agilysys Retail</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="assets/images/agil_favicon.ico">
  <!-- <link rel="icon" type="image/x-icon" href="favicon.ico"> -->
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>window.global = window;</script>
    <!-- Google Maps API - Load dynamically based on stored key -->
  <script>
    (function() {
      var apiKey = localStorage.getItem('googleMapsApiKey');
      if (apiKey && !localStorage.getItem('resetMapApiKey') && !localStorage.getItem('invalidKey')) {
        var script = document.createElement('script');
        script.src = 'https://maps.googleapis.com/maps/api/js?key=' + apiKey + '&libraries=places';
        script.async = true;
        script.defer = true;
        document.head.appendChild(script);
      }
    })();
  </script>
</head>

<body>
  <div id="cover-spin" style="display: none;">
    <div class="customspinnerimg">
      <img src="./assets/images/agil_favicon.ico">
    </div>
    <div id="default-message">Processing...</div>
  </div>
  <div id="custom-cover-spin" style="display: none;">
    <div class="customspinnerimg">
      <img src="./assets/images/agil_favicon.ico">
    </div>
    <div id="custom-cover-message"></div>
  </div>
  <div id="signature-loader" style="display: none;">
    <img id="loaderImg" src="./assets/images/signature.gif" alt="No Data">
    <div id="signature-cover-message"></div>
  </div>
  <app-root></app-root>
</body>

</html>
