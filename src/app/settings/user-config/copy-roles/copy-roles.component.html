<section class="pop-container">
  <div class="pop-head border-top">
    <label class="inner-header pl-4 LW20">{{data.headername | uppercase}}</label>
    <i *ngIf="data.closebool" class="material-icons inner-close IC30 float-md-right cursPointer"
      (click)="Cancel()">close</i>
  </div>
  <div class="pop-contents">
    <div class="copy-roles-section  pt-2">
      <form [formGroup]="roleGrp" class="form-section">
        <div class="content-section pl-4 pr-4 ag_display--flex pb-1">
          <mat-form-field class="d-block mr-4 text-capitalize copy-from" [floatLabel]="floatLabel">  <mat-label>{{captions.copyFrom}}</mat-label>
            <mat-select formControlName="copyFrom" (selectionChange)="configChanged($event)" required>
              <mat-option [(value)]="item.description" *ngFor="let item of sampleOptions">{{item.description}}
              </mat-option>
            </mat-select>
            <mat-error *ngIf="roleGrp.get('copyFrom')?.touched && roleGrp.get('copyFrom')?.hasError('required')">{{captions.missingCopyFrom}}</mat-error>
          </mat-form-field>
          <mat-form-field class="d-block text-capitalize copy-to" [floatLabel]="floatLabel" [hideRequiredMarker]="!roleGrp.get('copyTo')?.enabled">  <mat-label>{{captions.copyTo}}</mat-label>
            <mat-select formControlName="copyTo" [required]="roleGrp.get('copyTo')?.enabled">
              <mat-option [(value)]="item.description" *ngFor="let item of secondOptionsSet">{{item.description}}
              </mat-option>
            </mat-select>
            <mat-error *ngIf="roleGrp.get('copyTo')?.enabled && roleGrp.get('copyTo')?.touched && roleGrp.get('copyTo')?.hasError('required')">{{captions.missingCopyTo}}</mat-error>
          </mat-form-field>
        </div>
        <div mat-dialog-actions class=" dialog-section pl-4 pr-4">
          <div class="pop-button pt-2">
            <button [ngClass]="this.roleGrp.valid && this.roleGrp.dirty ? 'button_valid': 'button_invalid'" mat-button
              class="LW14 body-bgcolor text-uppercase  whitecolor"
              (click)="SaveCopyRoles() ">{{captions.update}}</button>
            <button mat-button class="ml-2 text-uppercase  LW14 " (click)="Cancel() "> {{captions.cancel}} </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</section>
