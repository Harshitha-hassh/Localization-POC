<section class="h-100 newVersionWrapper additional-information-wrapper">
    <form [formGroup]="FormGrp" autocomplete="off" class="h-100">
        <ng-scrollbar [trackX]="true" [autoHide]="true">
            <div class="d-inline-block width_75 p-4 padding_container">
                <div>
                    <label class="form-label-primary">{{captions.VipTypeInformation}}</label>
                    <div>
                        <mat-form-field class="mt-4" [floatLabel]="floatLabel" >
                            <mat-select [attr.automationId]="'Dd_AdditionalInformation_viptype'" [placeholder]="captions.VipType"
                                formControlName="vip">
                                <mat-option value=""></mat-option>
                                <mat-option [value]="type.code" *ngFor="let type of vipTypes">{{type.name}}</mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>
                </div>
                <div>
                    <label class="form-label-primary">{{captions.GuestTypeInformation}}</label>
                    <div>
                        <mat-form-field class="mt-4" [floatLabel]="floatLabel" >
                            <mat-select [attr.automationId]="'Dd_AdditionalInformation_guesttype'" [placeholder]="captions.guestType"
                                formControlName="guestType">
                                <mat-option value=""></mat-option>
                                <mat-option [value]="type.id" *ngFor="let type of guestTypes">{{type.name}}</mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>
                </div>  
                <app-retail-capture-card
                    [PaymentReferenceID]="PaymentReferenceID"
                    [isShowPMAgentValidationMessage]="false"
                    (NewPaymentReferenceID)="SaveReferenceId($event)"
                    (removeDetails)="removeCardReference()">
                </app-retail-capture-card>
                <div class="" *ngIf="false">
                    <div class=" width_220"
                        [ngClass]="this.isClientViewOnly ? 'button_invalid' : ''">
                        <mat-form-field class="width_180px" [floatLabel]="floatLabel">
                            <input [attr.automationId]="'Txt_additionalinformation_expiryDate'" matInput dateRestricter class="" [min]="minFromDate" [matDatepicker]="picker"
                                [placeholder]="captions.ExpiryDate" [readonly]="true">
                            <mat-datepicker #picker></mat-datepicker>
                            <i [attr.automationId]="'Icn_additionalinformation_pickerOpen'" matSuffix
                                class="icon-Calender cursor fs-xlarge position-relative d-inline-block customCalendar"
                                (click)="picker.open()"></i>
                        </mat-form-field>

                    </div>
                </div>

                <div class="">
                    <label class="form-label-primary" [hidden]="isTitleHidden">{{captions.OTHERINFORMATION}}</label>
                </div>

            <aside class="w-25 d-inline-block p-4">
                <mat-form-field class="width_100 txt-area-height" [floatLabel]="floatLabel">
                    <textarea [attr.automationId]="'Ta_additionalinformation_comments'" class="textarea-style" [maxlength]="250" matInput formControlName="comments"
                        [placeholder]="captions.GeneralComments"></textarea>
                </mat-form-field>
                <div class="gdpr-wrapper pt-3"   *ngIf="IsGDPREnabled">
                    <div class="ag_display--flex wrapper">
                        <div [attr.automationId]="'Lbl_additionalinformation_guestPolicyDialog1'" (click)="openGuestPolicyDialog(1);" class="divider" >
                            <span class="boxed-icon" >
                                <i class="icon-policy"></i>
                                <i *ngIf="policyType == 2" class="icon-dashboard-tick"></i>
                            </span>
                            <span class="span-label">{{captions.consentManagement}}</span>
                        </div>
                        <div [attr.automationId]="'Lbl_additionalinformation_guestPolicyDialog2'" (click)="openGuestPolicyDialog(2);" class="divider" [ngClass]="(actionType == 'EDIT' && additionalInfo && additionalInfo.client && additionalInfo.client.isPurged == true) || (actionType != 'EDIT') || (additionalInfo && additionalInfo.client && additionalInfo.client.Id == '') ? 'ag_link--disabled opacity-spa' : ''" >
                            <span class="boxed-icon">
                                <i class="icon-retention"></i>
                                <i *ngIf="actionType == 'EDIT' && additionalInfo && additionalInfo.client.isPurged == true" class="icon-dashboard-tick"></i>
                            </span>
                            <span class="span-label">{{captions.retentionManagement}}</span>
                        </div>
                        <!-- <div (click)="openGuestPolicyDialog(3);" class="divider border-right-0" [ngClass]="actionType != 'EDIT' || (additionalInfo && additionalInfo.client && additionalInfo.client.Id == '') ? 'ag_link--disabled opacity-spa' : ''"> -->

                            <div [attr.automationId]="'Lbl_additionalinformation_guestPolicyDialog3'" (click)="openGuestPolicyDialog(3);" class="divider border-right-0" [ngClass]="'ag_link--disabled opacity-spa'">
                                <span class="boxed-icon">
                                <i class="icon-export"></i>
                                <!-- <i class="icon-dashboard-tick"></i> -->
                            </span>
                            <span class="span-label">{{captions.exportSend}}</span>
