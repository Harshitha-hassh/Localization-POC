<mat-tab-group [attr.automationId]="'Mt_createClient_clientTab'" [selectedIndex]="clientSelectedTab" #clientTabGroupc class="tab-styling-versiontwo">
  <mat-tab label="{{captions.PersonalInformation}}">
    <app-personal-information [parentForm]="parentForm" [clientEditData]="this" (imageUpdateEmit)="onImageUpdates($event)"
     [inputData]="clientInfoInput" [patronId]="patronId"  [clientInfoData] = "clientInfoData"></app-personal-information>
  </mat-tab>
  <mat-tab label="{{captions.AdditionalInformation}}">
    <app-additional-information [parentForm]="parentForm" [IsGDPREnabled] = 'IsGDPREnabled' [policyType] = 'policyType' [inputData]="clientInfoInput"></app-additional-information>
  </mat-tab>
  <mat-tab label="{{captions.History}}">
    <app-transaction-history [parentForm]="parentForm" [inputData]="clientInfoInput"></app-transaction-history>
  </mat-tab>
  <mat-tab label="{{captions.Itinerary}}">
    <div class="cus-pad">
      <app-common-itinerary [guestId]="guestId" [isCopyClient] = "isCopyClient"></app-common-itinerary>
    </div>
  </mat-tab>
</mat-tab-group>
