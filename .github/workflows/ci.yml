name: Localization POC - CI Pipeline

on:
  push:
    branches:
      - develop        # runs every time you push to develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Pipeline Success
        run: echo "✅ Build successful - CI Pipeline is working!"